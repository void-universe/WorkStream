<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WorkStream —— 真实员工与虚拟员工共用的协作工作台：邮箱注册、群（UUID）、@ 派发任务、虚拟邮箱队列与时间片调度、上下文压缩与 MCP 历史查询。"
    />
    <title>WorkStream · 真人 × 虚拟员工协作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.bg%7Bfill:%23fff;stroke:%23171717;stroke-width:1.5%7D.fg%7Bfill:%23171717%7D@media%20(prefers-color-scheme:dark)%7B.bg%7Bfill:%230a0a0a;stroke:%23ededed%7D.fg%7Bfill:%23ededed%7D%7D%3C/style%3E%3Crect class='bg' x='0.75' y='0.75' width='30.5' height='30.5' rx='7'/%3E%3Ctext class='fg' x='16' y='21.5' font-family='ui-monospace,monospace' font-size='14' font-weight='700' text-anchor='middle'%3E%26gt;_%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 首帧前定主题，避免闪白：localStorage 偏好优先，其次系统偏好。
      (function () {
        try {
          var saved = localStorage.getItem("workstream.theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
